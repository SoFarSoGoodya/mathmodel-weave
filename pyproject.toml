[project]
name = "mathmodel-weave"
version = "0.1.0"
description = "File-based multi-agent mathematical modeling workspace"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pypdf>=6.18.1",
]

[project.scripts]
mmagent = "mathmodel_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathmodel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.test-tmp"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
